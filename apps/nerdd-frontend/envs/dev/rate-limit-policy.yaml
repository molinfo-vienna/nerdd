apiVersion: gateway.nginx.org/v1alpha1
kind: RateLimitPolicy
metadata:
  name: frontend-rate-limit
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: frontend-route
  rateLimit:
    rejectCode: 429
    logLevel: warn
    local:
      rules:
        - zoneSize: 10m
          key: "$binary_remote_addr"
          rate: 10r/s
          burst: 50
          noDelay: true
