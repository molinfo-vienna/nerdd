apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
  - ghcr-secret.yaml

components:
  - ../../../_common/nerdd-module/envs/dev


patches:
  - target:
      kind: Deployment
      name: fame3
    path: patch-deployment.yaml
  - target:
      kind: ImageUpdater
      name: fame3
    patch: |-
      - op: replace
        path: /spec/applicationRefs/0/namePattern
        value: dev-fame
