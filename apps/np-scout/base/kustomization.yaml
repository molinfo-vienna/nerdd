apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

configMapGenerator:
  - name: app-config
    literals:
      - image=ghcr.io/molinfo-vienna/np-scout:latest
      - appName=np-scout
      - modelClass=np_scout.NPScoutModel
      - cpuRequest=1
      - memRequest=2Gi
      - cpuLimit=1
      - memLimit=2Gi
