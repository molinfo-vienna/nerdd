apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rethinkdb
spec:
  serviceName: rethinkdb-internal
  replicas: 3
  selector:
    matchLabels:
      app: rethinkdb
  template:
    metadata:
      labels:
        app: rethinkdb
    spec:
      # distribute instances across nodes
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: app
                    operator: In
                    values:
                      - rethinkdb
              topologyKey: "kubernetes.io/hostname"
      containers:
        - name: rethinkdb
          image: rethinkdb:2.4.2
          # use a custom command to
          # (1) set up the rethinkdb cluster communication and
          # (2) avoid creating default databases
          command:
            - sh
            - -c
            - |
              ordinal=$(hostname | awk -F- '{print $NF}');
              echo "Starting rethinkdb node rethinkdb-$ordinal...";
              # avoid creating default databases
              rethinkdb create;
              # join all other resolvable peers so any restarting node reconnects to the cluster
              join_args=""
              for i in 0 1 2; do
                if [ "$i" -ne "$ordinal" ]; then
                  peer="rethinkdb-$i.rethinkdb-internal"
                  if getent hosts "$peer" >/dev/null 2>&1; then
                    join_args="$join_args --join $peer:29015"
                  fi
                fi
              done
              exec rethinkdb --bind all --cache-size 4096 $join_args
          readinessProbe:
            tcpSocket:
              port: 28015
          resources:
            requests:
              cpu: 500m
              memory: 6Gi
            limits:
              cpu: "2"
              memory: 8Gi
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: rook-ceph-block
        resources:
          requests:
            storage: 200Gi
