apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

configMapGenerator:
  - name: app-config
    literals:
      - image=ghcr.io/molinfo-vienna/gloryx:latest
      - appName=gloryx
      - modelClass=gloryx.GloryXModel
      - cpuRequest=2.5
      - memRequest=5Gi
      - cpuLimit=4.5
      - memLimit=6.5Gi
