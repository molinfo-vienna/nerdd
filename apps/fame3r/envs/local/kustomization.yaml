apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

components:
  - ../../../_common/nerdd-module/envs/local

configMapGenerator:
  - name: app-config
    behavior: merge
    literals:
      - image=fame3r:latest

patches:
  - target:
      kind: Deployment
      name: fame3r
    path: patch-deployment.yaml

