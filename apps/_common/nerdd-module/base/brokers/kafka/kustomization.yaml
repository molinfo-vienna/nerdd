apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

resources:
  - topic.yaml

replacements:
  - source:
      kind: ConfigMap
      name: app-config
      fieldPath: data.appName
    targets:
      - select:
          kind: KafkaTopic
        fieldPaths:
          - metadata.labels.app
      - select:
          kind: KafkaTopic
        fieldPaths:
          - metadata.name
        options:
          delimiter: "-"
          index: 0
