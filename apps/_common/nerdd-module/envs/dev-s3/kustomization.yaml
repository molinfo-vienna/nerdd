apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

components:
  - ../../base

configMapGenerator:
  - name: app-config
    behavior: merge
    literals:
      - minReplicaCount=1
      - maxReplicaCount=10

patches:
  - target:
      kind: KafkaTopic
    patch: |-
      - op: replace
        path: /metadata/namespace
        value: dev-kafka
  # for now, we set S3 args only for modules that use the most recent version of nerdd-link
  - target:
      kind: Deployment
    patch: |-
      - op: remove
        path: /spec/template/spec/containers/0/volumeMounts/0
      - op: remove
        path: /spec/template/spec/volumes/0
      - op: replace
        path: /spec/template/spec/containers/0/args
        value:
          - MODEL_CLASS
          - --channel=$(CHANNEL)
          - --broker-url=$(BROKER_URL)
          - --broker-username=$(BROKER_USERNAME)
          - --broker-password=$(BROKER_PASSWORD)
          - --s3-url=$(S3_URL)
          - --s3-bucket=$(S3_BUCKET)
          - --s3-access-key-id=$(S3_ACCESS_KEY_ID)
          - --s3-secret-access-key=$(S3_SECRET_ACCESS_KEY)
