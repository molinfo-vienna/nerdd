apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

components:
  - ../../base/core
  - ../../base/brokers/kafka

configMapGenerator:
  - name: app-config
    behavior: merge
    literals:
      - minReplicaCount=1
      - maxReplicaCount=1

secretGenerator:
  - name: APP_NAME-broker-config
    literals:
      - channel=kafka
      - broker_url=kafka-cluster-kafka-bootstrap.minimum:9092
      - broker_username=""
      - broker_password=""
  - name: APP_NAME-s3-config
    literals:
      - s3_url=http://minio.minimum.svc
      - s3_bucket=job-data
      - s3_access_key_id=minioadmin
      - s3_secret_access_key=minioadmin

patches:
  - target:
      kind: KafkaTopic
    path: patch-topic.yaml

replacements:
  - source:
      kind: ConfigMap
      name: app-config
      fieldPath: data.appName
    targets:
      - select:
          kind: Secret
          name: APP_NAME-broker-config
        fieldPaths:
          - metadata.name
        options:
          delimiter: "-"
          index: 0
      - select:
          kind: Secret
          name: APP_NAME-s3-config
        fieldPaths:
          - metadata.name
        options:
          delimiter: "-"
          index: 0
