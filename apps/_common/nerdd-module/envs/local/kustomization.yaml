apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

components:
  - ../../base

resources:
  - broker-config-es.yaml
  - s3-config-es.yaml
  - scaler.yaml


configMapGenerator:
  - name: app-config
    behavior: merge
    literals:
      - minReplicaCount=1
      - maxReplicaCount=3

patches:
  - target:
      kind: KafkaTopic
    path: patch-topic.yaml


replacements:
  - source:
      kind: ConfigMap
      name: app-config
      fieldPath: data.appName
    targets:
      - select:
          kind: ExternalSecret
          name: APP_NAME-broker-config
        fieldPaths:
          - metadata.name
          - spec.target.name
        options:
          delimiter: "-"
          index: 0
      - select:
          kind: ExternalSecret
          name: APP_NAME-s3-config
        fieldPaths:
          - metadata.name
          - spec.target.name
        options:
          delimiter: "-"
          index: 0
