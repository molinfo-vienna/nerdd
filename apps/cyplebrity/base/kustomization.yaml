apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

configMapGenerator:
  - name: app-config
    literals:
      - appName=cyplebrity
      - modelClass=cyplebrity.CyplebrityModel
      - topic=cyplebrity-checkpoints
      - consumerGroup=predict-checkpoints-cyplebrity
      - cpuRequest=1000m
      - memRequest=4Gi
      - cpuLimit=2000m
      - memLimit=4Gi
