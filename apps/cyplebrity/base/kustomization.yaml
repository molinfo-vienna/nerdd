apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

configMapGenerator:
  - name: app-config
    literals:
      - image=ghcr.io/molinfo-vienna/cyplebrity:latest
      - appName=cyplebrity
      - modelClass=cyplebrity.CyplebrityModel
      - cpuRequest=1000m
      - memRequest=4Gi
      - cpuLimit=2000m
      - memLimit=4Gi
