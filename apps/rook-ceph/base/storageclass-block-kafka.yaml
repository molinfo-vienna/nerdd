apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: rook-ceph-block-kafka
# Change "rook-ceph" provisioner prefix to match the operator namespace if needed
provisioner: rook-ceph.rbd.csi.ceph.com
parameters:
  # clusterID is the namespace where the rook cluster is running
  clusterID: rook-ceph
  # Ceph pool into which the RBD image shall be created
  pool: blockpool-kafka

  # RBD image format. Defaults to "2".
  imageFormat: "2"

  # RBD image features. Available for imageFormat: "2". CSI RBD currently supports only `layering` feature.
  imageFeatures: layering

  # The secrets contain Ceph admin credentials.
  csi.storage.k8s.io/provisioner-secret-name: rook-csi-rbd-provisioner
  csi.storage.k8s.io/provisioner-secret-namespace: rook-ceph
  csi.storage.k8s.io/controller-expand-secret-name: rook-csi-rbd-provisioner
  csi.storage.k8s.io/controller-expand-secret-namespace: rook-ceph
  csi.storage.k8s.io/node-stage-secret-name: rook-csi-rbd-node
  csi.storage.k8s.io/node-stage-secret-namespace: rook-ceph

  # Specify the filesystem type of the volume.
  csi.storage.k8s.io/fstype: ext4

# Retain the rbd volume when a PVC is deleted
reclaimPolicy: Retain

# Allow dynamic resize for PVC
allowVolumeExpansion: true

# Delay binding until pod is scheduled to respect topology and anti-affinity
volumeBindingMode: WaitForFirstConsumer

# Mount options optimized for Kafka append-only commit logs
mountOptions:
  - noatime # stops recording file/directory read access timestamps
  - nodiratime # explicitly disables directory access time updates
  - data=ordered # guarantees data blocks are written before metadata commits
  - commit=30 # batch metadata updates at 30s (default: 5s)
  - delalloc # delayed block allocation -> reduce fragmentation on sequential writes
  - noinit_itable # skips background inode table zeroing on newly formatted volumes
