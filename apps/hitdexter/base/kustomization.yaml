apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

configMapGenerator:
  - name: app-config
    literals:
      - appName=hitdexter
      - modelClass=hitdexter.HitDexter3Model
      - topic=hitdexter3-checkpoints
      - consumerGroup=predict-checkpoints-hitdexter3
      - cpuRequest=4000m
      - memRequest=2G
      - cpuLimit=4000m
      - memLimit=2G
