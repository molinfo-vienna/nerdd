apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

components:
  - ../../../_common/nerdd-module/envs/dev

patches:
  - target:
      kind: ImageUpdater
      name: hitdexter3
    patch: |-
      - op: replace
        path: /spec/applicationRefs/0/namePattern
        value: dev-hitdexter
