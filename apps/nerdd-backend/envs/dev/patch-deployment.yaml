apiVersion: apps/v1
kind: Deployment
metadata:
  name: nerdd-backend
spec:
  template:
    spec:
      containers:
        - name: nerdd-backend
          args:
            - --config-name
            - production
            - ++db.host=$(DB_HOST)
            - ++db.port=$(DB_PORT)
            - ++channel.name=$(CHANNEL)
            - ++channel.broker_url=$(BROKER_URL)
            - ++channel.broker_username=$(BROKER_USERNAME)
            - ++channel.broker_password=$(BROKER_PASSWORD)
            - ++media_root=/data
            - ++s3_url=$(S3_URL)
            - ++s3_bucket=$(S3_BUCKET)
            - ++s3_access_key_id=$(S3_ACCESS_KEY_ID)
            - ++s3_secret_access_key=$(S3_SECRET_ACCESS_KEY)
          env:
            - name: DB_HOST
              value: rethinkdb.dev
            - name: DB_PORT
              value: "28015"
            - name: CHANNEL
              valueFrom:
                secretKeyRef:
                  name: broker-config-backend
                  key: channel
            - name: BROKER_URL
              valueFrom:
                secretKeyRef:
                  name: broker-config-backend
                  key: broker_url
            - name: BROKER_USERNAME
              valueFrom:
                secretKeyRef:
                  name: broker-config-backend
                  key: broker_username
            - name: BROKER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: broker-config-backend
                  key: broker_password
            - name: S3_URL
              valueFrom:
                secretKeyRef:
                  name: s3-config-backend
                  key: s3_url
            - name: S3_BUCKET
              valueFrom:
                secretKeyRef:
                  name: s3-config-backend
                  key: s3_bucket
            - name: S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: s3-config-backend
                  key: s3_access_key_id
            - name: S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: s3-config-backend
                  key: s3_secret_access_key
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: pvc-media
