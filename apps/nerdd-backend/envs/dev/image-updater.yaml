apiVersion: argocd-image-updater.argoproj.io/v1alpha1
kind: ImageUpdater
metadata:
  name: nerdd-backend
  namespace: argocd
spec:
  commonUpdateSettings:
    updateStrategy: digest
  writeBackConfig:
    method: git:secret:git-creds
    gitConfig:
      branch: main
  applicationRefs:
    - namePattern: dev-nerdd-backend
      images:
        - alias: app
          imageName: ghcr.io/molinfo-vienna/nerdd-backend:latest
