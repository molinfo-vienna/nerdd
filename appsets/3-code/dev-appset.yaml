apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: dev-appset
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - git:
        repoURL: https://github.com/molinfo-vienna/nerdd.git
        revision: HEAD
        directories:
          - path: apps/*/envs/dev
  template:
    metadata:
      name: "{{index .path.segments 3}}-{{index .path.segments 1}}"
      annotations:
        argocd-image-updater.argoproj.io/update-strategy: digest
        argocd-image-updater.argoproj.io/image-list: "ghcr.io/molinfo-vienna/{{index .path.segments 1}}:latest"
        argocd-image-updater.argoproj.io/write-back-method: git:secret:argocd/git-creds

    spec:
      # The project the application belongs to.
      project: default
      # Source of the application manifests
      source:
        repoURL: https://github.com/molinfo-vienna/nerdd.git
        targetRevision: HEAD
        path: "{{.path.path}}"

      # Destination cluster and namespace to deploy the application
      destination:
        server: https://kubernetes.default.svc
        # all dev apps were previously put into a common namespace "dev"
        # at the moment, these apps are moved to their own namespace incrementally
        # temporarily declare a custom list of apps that are already migrated
        namespace: '{{if has (index .path.segments 1) (list "kafka" "s3" "credentials" "cypstrate" "cyplebrity" "fame" "glory" "gloryx" "hitdexter" "np-scout" "skin-doctor-cp" "skin-doctor-ternary")}}dev-{{index .path.segments 1}}{{else}}{{index .path.segments 3}}{{end}}'

      # Sync policy
      syncPolicy:
        syncOptions:
          - CreateNamespace=true
          # enable loading large CRDs (otherwise we get error messages)
          - ServerSideApply=true
        automated: # automated sync by default retries failed attempts 5 times with following delays between attempts ( 5s, 10s, 20s, 40s, 80s ); retry controlled using `retry` field.
          prune: true # Specifies if resources should be pruned during auto-syncing ( false by default ).
          selfHeal: true # Specifies if partial app sync should be executed when resources are changed only in target Kubernetes cluster and no git change detected ( false by default ).
